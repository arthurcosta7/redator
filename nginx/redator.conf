# ─────────────────────────────────────────────────────────────────────────────

# Proteções compartilhadas contra rajadas, conexões excessivas e slow clients.
# Estas diretivas ficam no contexto http quando o arquivo está em conf.d/.
limit_req_zone $binary_remote_addr zone=redator_api_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=redator_connections_per_ip:10m;
# redator.conf — Nginx para produção
#
# CENÁRIO A (recomendado): Vercel para frontend + VPS para backend
#   → Ative apenas o bloco "api.redator.online"
#   → No Vercel, configure NEXT_PUBLIC_API_URL=https://api.redator.online
#
# CENÁRIO B: Tudo na VPS
#   → Ative os dois blocos (api.redator.online + redator.online)
#
# Após configurar, instale o SSL:
#   certbot --nginx -d redator.online -d www.redator.online -d api.redator.online
# ─────────────────────────────────────────────────────────────────────────────

# ─── Redireciona HTTP → HTTPS ─────────────────────────────────────────────────
server {
    listen 80;
    server_name redator.online www.redator.online api.redator.online;
    return 301 https://$host$request_uri;
}

# ─── CENÁRIO A & B: Backend API ───────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.redator.online;

    # SSL — preenchido automaticamente pelo Certbot
    # ssl_certificate /etc/letsencrypt/live/api.redator.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.redator.online/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    # Limite de tamanho de upload (redações em foto)
    client_max_body_size 6M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;

    # Correções são enfileiradas; a API não mantém conexão aberta esperando a IA.
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;

    location / {
        limit_req zone=redator_api_per_ip burst=40 nodelay;
        limit_conn redator_connections_per_ip 20;
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necessário para cookies SameSite funcionarem via HTTPS
        proxy_cookie_flags ~ secure;
    }
}

