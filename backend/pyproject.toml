[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redator-backend"
version = "1.0.0"
description = "Plataforma de correção de redações com IA — Backend"
requires-python = ">=3.11"

dependencies = [
    # ─── Framework web ───────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",  # Upload de arquivos

    # ─── Banco de dados ───────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",          # Driver PostgreSQL assíncrono
    "alembic>=1.13.0",          # Migrações de banco

    # ─── Validação de dados (SEGURANÇA: valida todo input) ───────
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",

    # ─── Autenticação e segurança ──────────────────────────────────
    "bcrypt>=4.0.0",            # Hash de senhas (usado diretamente, sem passlib)
    "PyJWT>=2.8.0",             # JWT tokens (mais seguro que python-jose)
    "cryptography>=42.0.0",     # Criptografia

    # ─── Cache e Rate Limiting ─────────────────────────────────────
    "redis[hiredis]>=5.0.0",    # hiredis = parser C, mais rápido
    "slowapi>=0.1.9",           # Rate limiting para FastAPI

    # ─── Inteligência Artificial ───────────────────────────────────
    "anthropic>=0.30.0",        # Claude API

    # ─── OCR (leitura de fotos de redação) ────────────────────────
    "google-cloud-vision>=3.7.0",

    # ─── Pagamentos ───────────────────────────────────────────────
    "stripe>=10.0.0",

    # ─── Email ────────────────────────────────────────────────────
    "resend>=2.0.0",

    # ─── Logging estruturado (sem dados sensíveis) ────────────────
    "structlog>=24.2.0",

    # ─── HTTP client ──────────────────────────────────────────────
    "httpx>=0.27.0",

    # ─── Utilitários ──────────────────────────────────────────────
    "python-dotenv>=1.0.0",
    "pillow>=10.3.0",           # Validação e processamento de imagens
    "bleach>=6.1.0",            # Sanitização de HTML/texto
]

[project.optional-dependencies]
dev = [
    # ─── Testes ───────────────────────────────────────────────────
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",            # Client HTTP para testes
    "factory-boy>=3.3.0",       # Factories para criar dados de teste
    "faker>=25.0.0",            # Dados falsos realistas

    # ─── Qualidade de código ───────────────────────────────────────
    "ruff>=0.4.0",              # Linter + formatter
    "mypy>=1.10.0",             # Type checking
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Cobertura mínima de 80%
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
