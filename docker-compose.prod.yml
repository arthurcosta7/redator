services:

  # ─── Banco de dados ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: redator
      POSTGRES_USER: ${POSTGRES_USER:-redator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-redator} -d redator"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - redator_net

  # ─── Cache / Rate limiter ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # A fila de correções compartilha este Redis: noeviction impede que jobs sejam
    # descartados silenciosamente quando a memória atingir o limite.
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - redator_net

  # ─── Backend FastAPI ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Um único arquivo raiz alimenta tanto a interpolação do Compose quanto a
    # configuração da aplicação, evitando segredos divergentes entre arquivos.
    env_file: ./.env
    environment:
      # Sobrescreve as URLs locais para apontar para os containers
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-redator}:${POSTGRES_PASSWORD}@postgres:5432/redator
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # O segredo é montado somente para o serviço que processa imagens.
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_cloud_vision_credentials
      TRUST_PROXY_REAL_IP: "true"
    secrets:
      - google_cloud_vision_credentials
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--limit-concurrency", "200", "--backlog", "512", "--timeout-keep-alive", "5", "--no-access-log", "--no-server-header", "--log-level", "error"]
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - redator_net

  # ─── Worker de correção por IA ──────────────────────────────────────────────
  correction_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["arq", "app.workers.correction.WorkerSettings"]
    env_file: ./.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-redator}:${POSTGRES_PASSWORD}@postgres:5432/redator
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 3m
    healthcheck:
      test: ["CMD", "arq", "--check", "app.workers.correction.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - redator_net

  # ─── Frontend Next.js (descomente se NÃO usar Vercel) ───────────────────────
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #     args:
  #       NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
  #   restart: unless-stopped
  #   expose:
  #     - "3000"
  #   networks:
  #     - redator_net

volumes:
  postgres_data:
  redis_data:

secrets:
  google_cloud_vision_credentials:
    file: ${GOOGLE_VISION_CREDENTIALS_FILE:?Defina GOOGLE_VISION_CREDENTIALS_FILE no .env}

networks:
  redator_net:
    driver: bridge
